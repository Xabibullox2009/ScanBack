{% load static i18n_extras %}
<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ScanBack{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'qrhub/styles.css' %}">
</head>
<body>
    <div class="language-bar">
        <details class="language-switcher">
            <summary class="language-toggle" aria-label="{% tr 'language_label' %}">
                <span class="language-globe" aria-hidden="true">&#127760;</span>
                <span class="language-current">{{ current_language|upper }}</span>
            </summary>
            <div class="language-menu">
                {% for code, label in language_options %}
                    <a class="language-option{% if current_language == code %} is-active{% endif %}" href="{% url 'qrhub:switch_language' %}?lang={{ code }}&next={{ request.get_full_path|urlencode }}">
                        <span>{{ label }}</span>
                        {% if current_language == code %}
                            <span class="language-check">&#10003;</span>
                        {% endif %}
                    </a>
                {% endfor %}
            </div>
        </details>
    </div>
    {% block content %}{% endblock %}
</body>
</html>

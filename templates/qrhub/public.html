{% extends "base.html" %}

{% block title %}{{ qr_code.name }} | ScanBack{% endblock %}

{% block content %}
<main class="public-shell">
    <section class="public-card">
        <p class="eyebrow">ScanBack</p>
        <h1>{{ qr_code.name }}</h1>
        <p class="lead">If you found this item, please call the owner.</p>
        <a class="call-button" href="{{ qr_code.get_phone_link }}">
            <span class="call-emoji">📞</span>
            Call Owner
        </a>
        <p class="phone-label">{{ qr_code.phone }}</p>
    </section>
</main>
{% endblock %}
